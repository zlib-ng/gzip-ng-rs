[package]
name = "gzip-ng"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
description = "Parallel gzip replacement built on zlib-ng"
license = "Zlib"
repository = "https://github.com/zlib-ng/gzip-ng-rs"
readme = "README.md"
keywords = ["gzip", "zlib-ng", "deflate", "compression", "parallel"]
categories = ["compression", "command-line-utilities"]
exclude = ["/.github"]

# Where cargo-binstall finds the release archive for a target.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/gzip-ng-rs-{ version }-{ target }{ archive-suffix }"
bin-dir = "gzip-ng-rs-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[lib]
name = "gzng"

# The command keeps the name of the C tool it ports.
[[bin]]
name = "gzip-ng"
path = "src/main.rs"

[features]
default = ["threads", "zopfli"]
# Compress and decompress blocks on a thread pool.
threads = []
# Compress blocks with zopfli under --zopfli.
zopfli = ["dep:zopfli"]

[dependencies]
gearhash = "0.1.4"
libc = "0.2"
libz-ng-sys = "1.1.30"
memchr = "2"
zopfli = { version = "0.8.4", default-features = false, features = ["std"], optional = true }

# Unoptimized zopfli is slow enough to stall the tests of a debug build.
[profile.dev.package.zopfli]
opt-level = 3

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "gzblock"
harness = false

[[bench]]
name = "scanner"
harness = false
