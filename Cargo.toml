[package]
name = "gzip-ng"
version = "2.0.1"
edition = "2024"
description = "Parallel gzip replacement built on zlib-ng"
license = "Zlib"
repository = "https://github.com/nmoinvaz/gzip-ng-rs"
readme = "README.md"
keywords = ["gzip", "zlib-ng", "deflate", "compression", "parallel"]
categories = ["compression", "command-line-utilities"]

[lib]
name = "gzng"

[features]
default = ["threads"]
# Compress and decompress blocks on a thread pool.
threads = []

[dependencies]
libc = "0.2"
libz-ng-sys = "1.1.30"
memchr = "2"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "gzblock"
harness = false

[[bench]]
name = "scanner"
harness = false
