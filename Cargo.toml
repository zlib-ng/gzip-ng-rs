[package]
name = "gzip-ng-rs"
version = "2.0.2"
edition = "2024"
rust-version = "1.88"
description = "Parallel gzip replacement built on zlib-ng"
license = "Zlib"
repository = "https://github.com/zlib-ng/gzip-ng-rs"
readme = "README.md"
keywords = ["gzip", "zlib-ng", "deflate", "compression", "parallel"]
categories = ["compression", "command-line-utilities"]
exclude = ["/.github"]

[lib]
name = "gzng"

# The command keeps the name of the C tool it ports.
[[bin]]
name = "gzip-ng"
path = "src/main.rs"

[features]
default = ["threads"]
# Compress and decompress blocks on a thread pool.
threads = []

[dependencies]
libc = "0.2"
libz-ng-sys = "1.1.30"
memchr = "2"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "gzblock"
harness = false

[[bench]]
name = "scanner"
harness = false
