name: Rust
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-latest

          - name: Ubuntu x86_64 no threads
            os: ubuntu-latest
            cargo-args: --no-default-features

          - name: Ubuntu ARM64
            os: ubuntu-24.04-arm

          # The rest of Ubuntu's architectures, cross compiled and run under QEMU.
          - name: Ubuntu ARMv7
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            gnu: arm-linux-gnueabihf
            cargo-args: --target armv7-unknown-linux-gnueabihf

          - name: Ubuntu PPC64LE
            os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            gnu: powerpc64le-linux-gnu
            cargo-args: --target powerpc64le-unknown-linux-gnu

          - name: Ubuntu RISC-V 64
            os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            gnu: riscv64-linux-gnu
            cargo-args: --target riscv64gc-unknown-linux-gnu

          - name: Ubuntu S390X
            os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            gnu: s390x-linux-gnu
            cargo-args: --target s390x-unknown-linux-gnu

          - name: macOS ARM64
            os: macos-latest

          # The sanitizers need nightly. Tests run one at a time, the runtime does not see the
          # locks an uninstrumented standard library takes between test threads.
          - name: macOS ARM64 TSAN
            os: macos-latest
            toolchain: nightly
            rustflags: -Zsanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer
            cflags: -fsanitize=thread
            cargo-args: --target aarch64-apple-darwin --lib --bins --tests
            test-args: --test-threads=1

          # Apple's clang and rustc carry different ASAN runtimes, so zlib-ng stays uninstrumented.
          - name: macOS ARM64 ASAN
            os: macos-latest
            toolchain: nightly
            rustflags: -Zsanitizer=address -Cunsafe-allow-abi-mismatch=sanitizer
            cargo-args: --target aarch64-apple-darwin --lib --bins --tests

          - name: Windows MSVC x64
            os: windows-latest

          - name: Windows MSVC x86
            os: windows-latest
            target: i686-pc-windows-msvc
            cargo-args: --target i686-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      CFLAGS: ${{ matrix.cflags }}
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1
      TSAN_OPTIONS: abort_on_error=1:halt_on_error=1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install toolchain
        if: matrix.toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}

      - name: Install target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}

      # The cross compiler brings the target's C library, and binfmt hands what gets built to QEMU.
      - name: Install cross toolchain
        if: matrix.gnu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.gnu }} qemu-user-static binfmt-support
          target=${{ matrix.target }}
          target=${target//-/_}
          {
            echo "CC_${target}=${{ matrix.gnu }}-gcc"
            echo "CARGO_TARGET_${target^^}_LINKER=${{ matrix.gnu }}-gcc"
            echo "QEMU_LD_PREFIX=/usr/${{ matrix.gnu }}"
          } >> "$GITHUB_ENV"

      - name: Build project
        run: cargo build ${{ matrix.cargo-args }}

      - name: Run tests
        timeout-minutes: 20
        run: cargo test ${{ matrix.cargo-args }} -- ${{ matrix.test-args }}

      - name: Build benchmarks
        if: ${{ !matrix.cargo-args }}
        run: cargo bench --no-run
