name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, also the tag, e.g. 2.0.0
        required: true
        type: string
      ref:
        description: Commit, tag, or branch to build
        required: true
        type: string
        default: develop

permissions:
  contents: write

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The package carries the version, and a release must match it.
      - name: Version matches the sources
        run: |
          want="${{ inputs.version }}"
          cargo=$(sed -n 's/^version = "\([0-9.]*\)".*/\1/p' Cargo.toml | head -n 1)
          test "$cargo" = "$want" || { echo "Cargo.toml says $cargo, not $want"; exit 1; }
          if git ls-remote --exit-code origin "refs/tags/$want" > /dev/null; then
            echo "tag $want already exists"
            exit 1
          fi

      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: linux-x86_64

          - name: Ubuntu ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: linux-arm64

          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            arch: macos-arm64

          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            arch: macos-x86_64
            skip-tests: true

          - name: Windows MSVC x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: windows-x64

          - name: Windows MSVC x86
            os: windows-latest
            target: i686-pc-windows-msvc
            arch: windows-x86

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Build project
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run tests
        if: ${{ !matrix.skip-tests }}
        timeout-minutes: 20
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Package
        if: runner.os != 'Windows'
        run: |
          dir=gzip-ng-rs-${{ inputs.version }}-${{ matrix.arch }}
          mkdir -p pkg/$dir
          cp target/${{ matrix.target }}/release/gzip-ng LICENSE.md README.md pkg/$dir/
          if [ "$RUNNER_OS" = "Linux" ]; then
            strip pkg/$dir/gzip-ng
          fi
          tar -czf $dir.tar.gz -C pkg $dir

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $dir = "gzip-ng-rs-${{ inputs.version }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path pkg/$dir | Out-Null
          Copy-Item target/${{ matrix.target }}/release/gzip-ng.exe, LICENSE.md, README.md pkg/$dir/
          Compress-Archive -Path pkg/$dir -DestinationPath "$dir.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Create the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ inputs.version }} dist/*
          --repo ${{ github.repository }}
          --target ${{ needs.check.outputs.sha }}
          --title "gzip-ng-rs ${{ inputs.version }}"
          --generate-notes

  # A published crate cannot be taken back, so it goes last, after everything else held.
  crate:
    name: Publish crate
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
