name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, also the tag, e.g. 2.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The push goes through a token that can reach the branch and start workflows on the commit.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Normalize version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          VERSION="${INPUT#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got $INPUT"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Update Cargo.lock
        run: cargo update --workspace

      # The tag refuses a version that was released before, since the checkout has every tag.
      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          # When a pull request has set the version already there is nothing to commit, and the
          # tag goes on HEAD.
          if ! git diff --cached --quiet; then
            git commit -m "Bump the version to $VERSION"
          fi
          git tag "$VERSION"
          git push origin "HEAD:$BRANCH"
          git push origin "$VERSION"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          - name: Ubuntu ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

          # The rest of Ubuntu's architectures, cross compiled and run under QEMU.
          - name: Ubuntu ARMv7
            os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            gnu: arm-linux-gnueabihf

          - name: Ubuntu PPC64LE
            os: ubuntu-22.04
            target: powerpc64le-unknown-linux-gnu
            gnu: powerpc64le-linux-gnu

          # zlib-ng 2.3.3 needs RVV intrinsics to build for RISC-V, and GCC 11 on 22.04 has none.
          - name: Ubuntu RISC-V 64
            os: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
            gnu: riscv64-linux-gnu

          - name: Ubuntu S390X
            os: ubuntu-22.04
            target: s390x-unknown-linux-gnu
            gnu: s390x-linux-gnu

          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin

          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            skip-tests: true

          - name: Windows MSVC x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

          - name: Windows MSVC x86
            os: windows-latest
            target: i686-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      # The cross compiler brings the target's C library, and binfmt hands what gets built to QEMU.
      - name: Install cross toolchain
        if: matrix.gnu
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.gnu }} qemu-user-static binfmt-support
          target=${{ matrix.target }}
          target=${target//-/_}
          {
            echo "CC_${target}=${{ matrix.gnu }}-gcc"
            echo "CARGO_TARGET_${target^^}_LINKER=${{ matrix.gnu }}-gcc"
            echo "QEMU_LD_PREFIX=/usr/${{ matrix.gnu }}"
          } >> "$GITHUB_ENV"

      - name: Build project
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Run tests
        if: ${{ !matrix.skip-tests }}
        timeout-minutes: 20
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Package
        if: runner.os != 'Windows'
        run: |
          dir=gzip-ng-rs-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          mkdir -p pkg/$dir
          cp target/${{ matrix.target }}/release/gzip-ng LICENSE.md README.md pkg/$dir/
          if [ "$RUNNER_OS" = "Linux" ]; then
            ${{ matrix.gnu && format('{0}-', matrix.gnu) || '' }}strip pkg/$dir/gzip-ng
          fi
          tar -czf $dir.tar.gz -C pkg $dir

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $dir = "gzip-ng-rs-${{ needs.prepare.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path pkg/$dir | Out-Null
          Copy-Item target/${{ matrix.target }}/release/gzip-ng.exe, LICENSE.md, README.md pkg/$dir/
          Compress-Archive -Path pkg/$dir -DestinationPath "$dir.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >
          gh release create "$VERSION" dist/*
          --repo ${{ github.repository }}
          --title "gzip-ng-rs $VERSION"
          --generate-notes

  # A published crate cannot be taken back, so it goes last, after everything else held.
  crate:
    name: Publish crate
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
